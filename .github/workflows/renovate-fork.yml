name: Renovate (fork image pins)

# Keeps the digest-pinned OKP images in openshift/, docs/DISCONNECTED.md and the
# quickstart docs current by opening one grouped PR when RHOKP or the RHEL CLA
# knowledge bridge publishes a new build. Config: .github/renovate-fork.js.
#
# Required repository secrets:
#   RENOVATE_TOKEN        fine-grained PAT for this repo: Contents + Pull requests
#                         read/write. Not GITHUB_TOKEN: PRs it opens don't trigger CI.
#   RH_REGISTRY_USERNAME  registry.redhat.io service account
#   RH_REGISTRY_PASSWORD  (https://access.redhat.com/terms-based-registry/); needed
#                         because registry.redhat.io refuses anonymous tag listing.

on:
  schedule:
    - cron: "0 7 * * 1"  # Weekly Monday 07:00 UTC; RHOKP publishes weekly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    # Fork-only: upstream runs the hosted Renovate app with its own config.
    if: github.repository == 'dmc5179/okp-mcp'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          configurationFile: .github/renovate-fork.js
          token: ${{ secrets.RENOVATE_TOKEN }}
          env-regex: "^(?:RENOVATE_\\w+|LOG_LEVEL|RH_REGISTRY_USERNAME|RH_REGISTRY_PASSWORD)$"
        env:
          LOG_LEVEL: info
          RH_REGISTRY_USERNAME: ${{ secrets.RH_REGISTRY_USERNAME }}
          RH_REGISTRY_PASSWORD: ${{ secrets.RH_REGISTRY_PASSWORD }}
