apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhokp-server
  namespace: rhokp-server
  labels:
    app: rhokp
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhokp-server
  namespace: rhokp-server
  labels:
    app: rhokp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rhokp
  template:
    metadata:
      labels:
        app: rhokp
    spec:
      serviceAccountName: rhokp-server
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: rhokp
        image: registry.redhat.io/offline-knowledge-portal/rhokp-rhel9:latest
        env:
        - name: SOLR_JETTY_HOST
          value: 0.0.0.0
        - name: ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: access-credentials
              key: access-key
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        - name: solr
          containerPort: 8983
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
---
apiVersion: v1
kind: Secret
metadata:
  name: access-credentials
  namespace: rhokp-server
type: Opaque
stringData:
  access-key: "${RHOKP_KEY}"
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: rhokp
  name: rhokp-server
  namespace: rhokp-server
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
  - name: solr
    port: 8983
    protocol: TCP
    targetPort: 8983
  selector:
    app: rhokp
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  annotations:
    openshift.io/host.generated: "true"
  labels:
    app: rhokp
  name: rhokp-server
  namespace: rhokp-server
spec:
  port:
    targetPort: 8080
  to:
    kind: Service
    name: rhokp-server
    weight: 100
  wildcardPolicy: None
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
