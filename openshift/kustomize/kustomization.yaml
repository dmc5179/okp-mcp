apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rhokp-server

resources:
  - okp-mcp-namespace.yaml
  # RHOKP Solr server
  - rhokp-serviceaccount.yaml
  - rhokp-deployment.yaml
  - rhokp-service.yaml
  - rhokp-route.yaml
  # OKP MCP server
  - mcp-serviceaccount.yaml
  - mcp-deployment.yaml
  - mcp-service.yaml
  - mcp-route.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: rhokp
    includeSelectors: false

# Secret must be provisioned out-of-band (ExternalSecrets, SealedSecrets, or
# Vault). See rhokp-deployment.yaml for the expected secret name and key.

# Images are pinned by digest so every sync deploys exactly the reviewed build.
# Tags are recorded for humans; kustomize emits name@digest. To bump, run
#   skopeo inspect --no-tags docker://<name>:<tag> | jq -r .Digest
# against the new tag and update both fields together.
images:
  - name: registry.redhat.io/offline-knowledge-portal/rhokp-rhel9
    # tag 1.3.0-1793303796
    digest: sha256:1ac156d35e14315011687c3740443e07d66c8d7d5be6839920cb2af7d8c65ce1
  - name: quay.io/redhat-services-prod/rhel-lightspeed-tenant/rhel-knowledge-bridge
    # tag e36106a (upstream commit)
    digest: sha256:99fd47d068c6b99db3068a7276c80e1d0bf98d3a1e908cae2d23b2b4571f7086
