apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhokp-server
  namespace: rhokp-server
  labels:
    app: rhokp-app
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhokp-server
  namespace: rhokp-server
  labels:
    app: rhokp-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rhokp-app
  template:
    metadata:
      labels:
        app: rhokp-app
    spec:
      serviceAccountName: rhokp-server
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: rhokp-mcp
        image: quay.io/danclark/okp-mcp:latest
        #image: quay.io/redhat-user-workloads/rhel-lightspeed-tenant/okp-mcp:latest   # No longer available. Moved??
        env:
        - name: MCP_TRANSPORT
          value: streamable-http
        - name: MCP_SOLR_URL
          value: "http://localhost:8983"  # This changes if I move the MCP container out of the same deployment pod
        ports:
        - name: solr
          containerPort: 8983
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
      - name: rhokp
        image: registry.redhat.io/offline-knowledge-portal/rhokp-rhel9:latest  # No longer available. Moved??
        env:
        - name: SOLR_JETTY_HOST
          value: 0.0.0.0
        - name: ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: access-credentials
              key: access-key
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        #volumeMounts:
        #- mountPath: /opt/solr/server/solr/portal/data
        #  name: okp-solr-data-pvc
---
apiVersion: v1
kind: Secret
metadata:
  name: access-credentials
  namespace: rhokp-server
type: Opaque
stringData:
  # This is the key obtained from rhn.redhat.com, encoded in base64
  access-key: "${RHOKP_KEY}"
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: rhokp-app
  name: rhokp-server
  namespace: rhokp-server
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: rhokp-app
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: rhokp-app
  name: rhokp-mcp
  namespace: rhokp-server
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - port: 8000
    protocol: TCP
    targetPort: 8000
  selector:
    app: rhokp-app
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  annotations:
    openshift.io/host.generated: "true"
  labels:
    app: rhokp-app
  name: rhokp-server
  namespace: rhokp-server
spec:
  port:
    targetPort: 8080
  to:
    kind: Service
    name: rhokp-server
    weight: 100
  wildcardPolicy: None
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  annotations:
    openshift.io/host.generated: "true"
  labels:
    app: rhokp-app
  name: rhokp-mcp
  namespace: rhokp-server
spec:
  port:
    targetPort: 8000
  to:
    kind: Service
    name: rhokp-mcp
    weight: 100
  wildcardPolicy: None
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
